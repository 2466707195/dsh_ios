name: iOS Build

on:
  push:
    branches: [main]
    paths:
      - "lib/**"
      - "pubspec.yaml"
      - "ios/**"
      - ".github/workflows/ios.yml"
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Build iOS
    runs-on: macos-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "zulu"
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true

      - name: Show versions
        run: |
          flutter --version
          xcodebuild -version
          pod --version

      # 工程里 lib/ 已存在；--platforms=ios 只补齐 iOS 工程骨架
      # （project.pbxproj / Podfile / Assets.xcassets 等），不会覆盖已有代码。
      - name: Ensure iOS scaffold
        run: flutter create --platforms=ios --org com.dsh --project-name dsh_ios .

      - name: Pub get
        run: flutter pub get

      - name: Analyze (report-only)
        run: flutter analyze --no-fatal-infos --no-fatal-warnings || true

      - name: Install CocoaPods dependencies
        working-directory: ios
        run: pod install

      # 阶段 1：无签名构建（产出真机 arm64 Runner.app）
      # Flutter CLI 构建真机前会做独立的 team 校验（即使 --no-codesign + 占位 team 也拦）。
      # 改用两步绕开：先 --config-only 让 Flutter 准备好原生工程与 Pod，
      # 再用 xcodebuild 直接编译真机 arm64 且关闭签名，产出未签名 Runner.app。
      - name: Prepare native project (config-only)
        env:
          CODE_SIGNING_ALLOWED: "NO"
        run: flutter build ios --release --config-only

      - name: Build unsigned device .app via xcodebuild
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild \
            -workspace Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            build | tail -40
          APP=$(find build/DerivedData/Build/Products -name "Runner.app" -type d | head -1)
          echo "APP=$APP"
          mkdir -p ../build/ios/iphoneos
          cp -R "$APP" ../build/ios/iphoneos/Runner.app
          ls -lh ../build/ios/iphoneos/Runner.app

      - name: Upload unsigned .app
        uses: actions/upload-artifact@v4
        with:
          name: dsh-ios-unsigned-app
          path: build/ios/iphoneos/Runner.app
          retention-days: 7

      # 把未签名 .app 按 iOS 规范打包成 .ipa（Payload/Runner.app -> zip）
      # 未签名 .ipa 不能直接装真机，供你下载后用自己证书重签/侧载。
      - name: Pack unsigned IPA
        run: |
          mkdir -p build/ios/ipa/Payload
          cp -R build/ios/iphoneos/Runner.app build/ios/ipa/Payload/Runner.app
          cd build/ios/ipa
          zip -qry dsh-ios-unsigned.ipa Payload
          cd -
          ls -lh build/ios/ipa/dsh-ios-unsigned.ipa

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: dsh-ios-unsigned-ipa
          path: build/ios/ipa/dsh-ios-unsigned.ipa
          retention-days: 7
