name: dsh_ios
description: "DSH iOS — DeepSeek Harness 复刻 iOS 客户端（Flutter）"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"
  flutter: ^3.27.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # 状态管理
  flutter_riverpod: ^2.6.1

  # 存储
  shared_preferences: ^2.5.6
  flutter_secure_storage: ^9.2.2

  # 网络
  http: ^1.2.0

  # Markdown / 代码高亮
  flutter_markdown: ^0.7.4
  flutter_highlight: ^0.7.0

  # 工具
  uuid: ^4.5.1
  intl: any

flutter:
  uses-material-design: true
